  <script>
const API='';

let token=localStorage.getItem('b127_token')||'';
let currentUser=JSON.parse(localStorage.getItem('b127_user')||'null');
let cart=JSON.parse(localStorage.getItem('b127_cart')||'[]');

let products=[];
let categories=[];
let favoriteIds=[];

const $=id=>document.getElementById(id);

const money=v=>
new Intl.NumberFormat('fr-FR').format(Number(v||0))+' FCFA';

function escapeHtml(v){
return String(v??'').replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[c]));
}

function saveLocal(){
localStorage.setItem('b127_token',token);
localStorage.setItem('b127_user',JSON.stringify(currentUser));
localStorage.setItem('b127_cart',JSON.stringify(cart));
}

function showToast(message,type='info'){
const box=document.createElement('div');

box.className=
'toast '+
(type==='error'?'error':
type==='success'?'success':'');

box.textContent=message;

$('toast-container').appendChild(box);

setTimeout(()=>{
box.remove();
},4000);
}

function headers(){
const h={
'Content-Type':'application/json'
};

if(token){
h.Authorization='Bearer '+token;
}

return h;
}

async function api(path,options={}){
const res=await fetch(
API+path,
{
...options,
headers:{
...headers(),
...(options.headers||{})
}
}
);

let data={};

try{
data=await res.json();
}catch(e){}

if(!res.ok){
throw new Error(
data.error||
data.message||
'Une erreur est survenue.'
);
}

return data;
}

function showSection(name){

document
.querySelectorAll('main>.section')
.forEach(s=>s.classList.add('hidden'));

const sec=$(name+'Section');

if(sec){
sec.classList.remove('hidden');
}

document
.querySelectorAll('.nav button')
.forEach(b=>b.classList.remove('active'));

if(name==='home'){
$('navHome').classList.add('active');
}

if(name==='products'){
loadProducts();
}

if(name==='favorites'){
loadFavorites();
}

if(name==='cart'){
renderCart();
}

if(name==='orders'){
loadOrders();
}

if(name==='seller'){
loadSeller();
}

if(name==='admin'){
loadAdmin();
}

window.scrollTo({
top:0,
behavior:'smooth'
});
}

function performSearch(){
showSection('products');
filterProducts();
}

$('searchInput').addEventListener(
'keydown',
e=>{
if(e.key==='Enter'){
performSearch();
}
}
);

function getProductImage(p){
return p.image||'';
}

function productVisual(p){

const img=getProductImage(p);

return img
?`<img
src="${escapeHtml(img)}"
alt="${escapeHtml(p.name)}"
onerror="this.style.display='none'">`
:`<div class="product-icon">
${escapeHtml(p.icon||'🛍️')}
</div>`;
}

function updateCartCount(){

$('cartCount').textContent=
cart.reduce(
(n,x)=>n+Number(x.qty||0),
0
);
}

function saveCart(){
localStorage.setItem(
'b127_cart',
JSON.stringify(cart)
);

updateCartCount();
}

function cartQuantity(id){

const x=cart.find(
i=>Number(i.id)===Number(id)
);

return x?Number(x.qty):0;
}

function addToCart(id){

const p=products.find(
x=>Number(x.id)===Number(id)
);

if(!p)return;

const stock=Number(p.stock||0);

if(stock<=0){
showToast(
'Produit indisponible',
'error'
);
return;
}

const q=cartQuantity(id);

if(q>=stock){
showToast(
'Stock maximum atteint',
'error'
);
return;
}

const item=cart.find(
x=>Number(x.id)===Number(id)
);

if(item){
item.qty++;
}else{

cart.push({
id:p.id,
name:p.name,
price:p.price,
image:p.image||'',
icon:p.icon||'🛍️',
qty:1
});

}

saveCart();

showToast(
'Produit ajouté au panier',
'success'
);
}

function changeCartQuantity(id,delta){

const item=cart.find(
x=>Number(x.id)===Number(id)
);

if(!item)return;

const p=products.find(
x=>Number(x.id)===Number(id)
);

const max=Number(
p?.stock??999999
);

item.qty=Math.max(
0,
Math.min(
max,
item.qty+delta
)
);

if(item.qty===0){

cart=cart.filter(
x=>Number(x.id)!==Number(id)
);

}

saveCart();
renderCart();
}

function removeFromCart(id){

cart=cart.filter(
x=>Number(x.id)!==Number(id)
);

saveCart();
renderCart();
}

function clearCart(){

cart=[];

saveCart();
renderCart();
}

function productMatchesSearch(p){

const q=
$('searchInput')
.value
.trim()
.toLowerCase();

return !q||
[
p.name,
p.category,
p.description
]

function categoryIcon(name){

const n=
String(name)
.toLowerCase();

if(n.includes('mode'))
return'👕';

if(
n.includes('élect')||
n.includes('electron')
)
return'📱';

if(n.includes('maison'))
return'🏠';

if(n.includes('beauté'))
return'💄';

if(n.includes('aliment'))
return'🍎';

return'🛍️';
}
